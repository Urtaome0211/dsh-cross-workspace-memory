name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本包零运行时依赖，所以没有 install 步骤
      - name: 单元测试（15 个用例）
        run: node test/store.test.mjs

      - name: 打包自检（应产出 lib / tools / test / docs / cordis.patch.yml）
        run: npm pack --dry-run
